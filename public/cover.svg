  <path d="M760 480L930 474L940 487L770 493Z" fill="#1b2836"/>

  <!-- chair -->
  <path d="M664 300Q660 278 682 275L760 268Q784 266 786 292L800 600L676 612Z" fill="#0a1017"/>
  <path d="M676 300L691 598" stroke="#ece8e1" stroke-opacity=".8" stroke-width="5"/>

  <!-- the player, from behind: jersey, arm to the mouse, headset -->
  <path d="M712 352Q720 318 760 312L840 306Q880 304 890 340L902 470Q904 520 860 528L760 540Q716 544 712 500Z" fill="#131e2a"/>
  <path d="M868 312Q886 318 890 340L902 470Q903 500 890 515L872 330Z" fill="#ff4655"/>
