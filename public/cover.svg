<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1118"/>
      <stop offset="1" stop-color="#16202c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ece8e1" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4655"/>
      <stop offset="1" stop-color="#c52f3c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23405a"/>
      <stop offset="1" stop-color="#0c1822"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd4ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- the red slab and its slashes -->
  <polygon points="860,0 1200,0 1200,630 640,630" fill="url(#slab)"/>
  <polygon points="826,0 840,0 620,630 606,630" fill="#ece8e1" opacity=".85"/>
  <polygon points="790,0 796,0 576,630 570,630" fill="#ff4655" opacity=".5"/>
  <text x="1168" y="58" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" letter-spacing="3" fill="#0e1620">// ROUND 24 · MATCH POINT</text>

  <!-- HUD corners -->
  <path d="M36 36h48M36 36v48" fill="none" stroke="#ff4655" stroke-width="5"/>
  <path d="M1164 594h-48M1164 594v-48" fill="none" stroke="#0e1620" stroke-width="5"/>

  <!-- monitor -->
  <path d="M958 176L1184 150V392L958 378Z" fill="#05090d"/>
  <path d="M970 188L1172 165V380L970 367Z" fill="url(#screen)"/>
  <circle cx="1071" cy="272" r="120" fill="url(#spill)"/>
  <text x="1071" y="212" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" font-weight="700" fill="#ece8e1">12 : 11</text>
  <path d="M1040 200h-40M1142 196h-40" stroke="#ece8e1" stroke-opacity=".35" stroke-width="3"/>
  <g stroke="#ff4655" stroke-width="4">
    <path d="M1071 242v18M1071 284v18M1041 272h18M1083 272h18"/>
  </g>
  <rect x="1068" y="269" width="6" height="6" fill="#ece8e1"/>
