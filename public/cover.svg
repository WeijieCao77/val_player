  <text x="800" y="452" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="68" font-weight="900" fill="#ece8e1">00</text>
  <path d="M872 336Q900 340 912 372L968 452Q976 470 958 478L930 480L884 410Z" fill="#131e2a"/>
  <path d="M872 336Q900 340 912 372L968 452" fill="none" stroke="#ece8e1" stroke-opacity=".55" stroke-width="3"/>
  <path d="M944 458L984 452Q996 456 992 472L952 482Z" fill="#0a1017"/>
  <path d="M982 462Q1000 452 1016 464Q1020 476 1004 482L986 480Z" fill="#ece8e1"/>
  <path d="M770 300L815 296L818 318L772 322Z" fill="#0a1017"/>
  <path d="M745 250Q742 196 792 188Q846 184 850 238Q852 282 820 300L780 304Q748 296 745 250Z" fill="#0a1017"/>
  <path d="M850 238Q852 282 820 300" fill="none" stroke="#ece8e1" stroke-opacity=".55" stroke-width="3"/>
  <path d="M752 236Q756 176 800 174Q846 174 848 232" fill="none" stroke="#ece8e1" stroke-width="10" stroke-linecap="round"/>
  <path d="M734 222L766 218L770 272L744 278L732 262Z" fill="#ff4655"/>
  <path d="M742 232L760 230L762 262L746 266Z" fill="#9e2632"/>
  <path d="M762 268Q792 318 856 300" fill="none" stroke="#ece8e1" stroke-width="5" stroke-linecap="round"/>
  <circle cx="860" cy="299" r="7" fill="#ece8e1"/>

  <!-- title -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif">
    <path d="M72 116H336L324 154H72Z" fill="#ff4655"/>
    <text x="88" y="142" font-size="19" font-weight="700" letter-spacing="2" fill="#0e1620">VCT 真实世界 · DEMO</text>
    <text x="66" y="262" font-size="104" font-weight="900" letter-spacing="4" fill="#ece8e1">无畏契约</text>
    <text x="66" y="380" font-size="104" font-weight="900" letter-spacing="4" fill="#ff4655">选手生涯</text>
    <path d="M72 404H430L416 418H72Z" fill="#ece8e1"/>
    <text x="72" y="466" font-size="30" fill="#9fb2c6">从天梯路人，打到冠军赛的舞台</text>
    <path d="M72 492H272L260 532H72Z" fill="none" stroke="#ece8e1" stroke-opacity=".55" stroke-width="2"/>
    <text x="90" y="519" font-size="21" font-weight="700" fill="#ece8e1">2021 · 改变历史</text>
    <path d="M292 492H492L480 532H292Z" fill="#ff4655" fill-opacity=".14" stroke="#ff4655" stroke-width="2"/>
    <text x="310" y="519" font-size="21" font-weight="700" fill="#ece8e1">2026 · 创造未来</text>
    <text x="72" y="592" font-size="16" fill="#9fb2c6" opacity=".7">无畏契约选手生涯模拟器 · 除了你，所有队伍和选手都是真实的</text>
  </g>
</svg>
