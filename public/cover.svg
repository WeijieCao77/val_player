  <text x="992" y="330" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#ff4655">A</text>
  <text x="1004" y="348" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#ece8e1">B</text>
  <!-- the Spike, planted -->
  <polygon points="1130,318 1146,327 1146,345 1130,354 1114,345 1114,327" fill="#0c1822" stroke="#ff4655" stroke-width="3"/>
  <rect x="1126" y="330" width="8" height="12" fill="#ff4655"/>
  <path d="M1060 384L1088 386L1096 470L1052 472Z" fill="#05090d"/>
  <path d="M1018 470L1132 465L1138 477L1014 482Z" fill="#05090d"/>

  <!-- desk -->
  <path d="M560 488L1200 470V630H520Z" fill="#070c12"/>
