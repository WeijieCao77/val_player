<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121c27" />
    <!-- The ground the page is drawn on, read before anything paints so a
         light page never flashes dark on its way in. Same key ui/theme.ts
         owns; this is only the first read. -->
    <script>
      try {
        var t = localStorage.getItem('valmgr.theme');
        if (t === 'light' || t === 'cream') {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'light' ? '#e6eaf0' : '#e9e1d0');
        }
      } catch (e) {}
    </script>
    <title>无畏契约选手生涯模拟器 · demo</title>
    <meta name="description" content="无畏契约（VALORANT）选手生涯模拟器：你是一名新人选手，在真实 VCT 世界里争首发、打比赛。" />
    <!-- the tab icon, drawn in public/favicon.svg; the PNGs are it rasterized for browsers and iOS that do not take SVG -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- what a shared link shows: public/cover.svg, rasterized -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="无畏契约选手生涯模拟器 · demo" />
    <meta property="og:description" content="你是一名新人选手，在真实 VCT 世界里争首发、打比赛。除了你，所有队伍和选手都是真实的。" />
    <meta property="og:image" content="https://valplayer-production.up.railway.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
